project:
  name: fertility_popEVE
  version: 0.1.0

paths:
  reference: /home/tian/ngs_project/ref/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna
  bed: /home/tian/ngs_project/bed/exons.bed
  raw_gvcf: data/raw_gvcf
  raw_gvcf_test: data/raw_gvcf_test
  joint_test: data/joint_test
  joint_vcf: data/joint_vcf
  annotation: data/joint_test_real/annotation
  missense: data/joint_test_real/missense
  protein: data/joint_test_real/protein
  features: data/joint_test_real/features
  embedding: data/embedding
  gp: data/joint_test_real/gp
  reference_data: data/reference
  logs: logs
  outputs: outputs

gatk:
  threads: 4

vep:
  cache: ~/.vep
  assembly: GRCh38
  fork: 24
  buffer_size: 100000

esm:
  model: esm1v

files:
  protein_mapping: data/reference/mapping/protein_mapping.parquet
  mapping_cache: data/reference/cache/ensembl_mapping.json

models:
  popeve: models/popEVE/data
  popeve_vcf: models/popeve_data/grch38_popEVE_ukbb_20250715.vcf.gz

training:
  vcf: data/joint_test_real/cohort_30.vcf.gz
  feature: data/features/feature_matrix.parquet
  variant: data/annotation/variant_table.parquet
  phenotype: data/phenotype/phenotype.csv
  output: data/joint_test_real/features/training_matrix.parquet

gp_training:
  epochs: 6000
  min_candidates: 100
  min_observed_variants: 10
  holdout_frac: 0.2
  convergence_patience: 500
  score_columns:
    - EVE
    - ESM1v

memory:
  total_gb: 2321
  safe_threshold_gb: 500
  danger_threshold_gb: 200
  watchdog_interval_sec: 30
  per_subprocess_limit_gb: 32
