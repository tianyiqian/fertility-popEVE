[project]
name = "fertility-popEVE"
version = "0.8.1"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "scripts/*.v1",
    "scripts/*.v2",
    "patches/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E402",  # module-level import not at top (sys.path.insert pattern)
    "E501",  # line too long
]

[tool.ruff.format]
quote-style = "double"
